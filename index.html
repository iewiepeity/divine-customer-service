<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>神明客服中心｜開場</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%8E%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="game">

    <!-- ① Scene / Background -->
    <div id="scene">
      <div id="bg-layer" class="bg-black"></div>
      <div id="bg-overlay"></div>
      <div id="deco-layer"></div>
      <div id="light-flash"></div>
      <div id="paper-wipe"></div>
      <div id="cloud-fade"></div>
      <div id="particle-dissolve">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </div>
    </div>

    <!-- ③ Interaction Layer (hotspots / character gallery / call record) -->
    <div id="interaction-layer"></div>

    <!-- On-stage character portrait (e.g. 玉皇大帝) for dialogue scenes -->
    <div id="stage-portrait" class="hidden" aria-hidden="true">
      <div id="stage-portrait-particles">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="stage-portrait-img"></div>
    </div>

    <!-- HUD (hidden on the title screen, where 設定 owns the sound toggle) -->
    <div id="hud" class="hidden">
      <button id="mute-btn" title="靜音／取消靜音"></button>
      <div id="save-indicator">已自動儲存</div>
    </div>

    <!-- Status Bar (fades in once the player formally takes office) -->
    <div id="hud-status" class="hidden">
      <button id="hud-toggle" aria-label="展開／收合狀態欄"><span class="hud-toggle-icon"></span></button>
      <div id="hud-body">
        <div class="hud-row" id="hud-datetime"></div>
        <div class="hud-row" id="hud-location"></div>
        <div class="hud-row" id="hud-pending"></div>
        <div class="hud-divider"></div>
        <div id="hud-spirits"></div>
      </div>
    </div>

    <!-- 案件處理回報單 (dispatch result card) -->
    <div id="result-layer" class="hidden">
      <div id="result-card">
        <div id="result-seal"></div>
        <div id="result-header">
          <div id="result-kicker">神界案件處理回報單</div>
          <div id="result-case-no"></div>
        </div>
        <div id="result-fields"></div>
        <button id="result-close">結案歸檔</button>
      </div>
    </div>

    <!-- ② Dialogue Box -->
    <div id="dialogue-box" class="hidden">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="advance-hint"></div>
    </div>

    <!-- ④ Choice UI -->
    <div id="choice-layer" class="hidden"></div>

    <!-- Item / Info Modal -->
    <div id="modal-layer" class="hidden">
      <div id="modal-box">
        <button id="modal-close" aria-label="關閉"></button>
        <div id="modal-image-wrap">
          <img id="modal-image" class="hidden" alt="" />
        </div>
        <div id="modal-title"></div>
        <div id="modal-body-wrap">
          <div id="modal-body"></div>
        </div>
        <div id="modal-nav">
          <button id="modal-prev" aria-label="上一頁"></button>
          <span id="modal-page"></span>
          <button id="modal-next" aria-label="下一頁"></button>
        </div>
      </div>
    </div>

    <!-- Title Screen — the key art carries the logo and the button plates;
         the buttons below are transparent hit areas aligned to the artwork. -->
    <div id="title-screen">
      <div id="title-backdrop" aria-hidden="true"></div>
      <div id="title-art">
        <div id="title-particles" aria-hidden="true">
          <span class="mote"></span><span class="mote"></span><span class="mote"></span>
          <span class="mote"></span><span class="mote"></span><span class="mote"></span>
          <span class="mote"></span><span class="mote"></span>
        </div>
        <h1 id="title-logo">神明客服中心</h1>
        <p id="title-sub">Divine Customer Service Center</p>
        <div id="title-buttons">
          <button id="btn-new-game" class="title-plate" style="--plate-top:56.50%" aria-label="開始遊戲"></button>
          <button id="btn-continue" class="title-plate is-locked" style="--plate-top:63.27%" aria-label="繼續遊戲" disabled></button>
          <button id="btn-roster" class="title-plate" style="--plate-top:69.97%" aria-label="神明名冊"></button>
          <button id="btn-settings" class="title-plate" style="--plate-top:76.81%" aria-label="設定"></button>
        </div>
      </div>
    </div>

    <!-- 設定 (settings panel, opened from the title screen) -->
    <div id="settings-screen" class="hidden">
      <div id="settings-panel">
        <div id="settings-header">
          <h2>設定</h2>
          <button id="settings-close" aria-label="關閉"></button>
        </div>
        <div class="settings-row">
          <span class="settings-label">音效</span>
          <button id="settings-sound" class="settings-toggle" aria-pressed="true"><span></span></button>
        </div>
        <div class="settings-row">
          <span class="settings-label">遊戲進度</span>
          <button id="settings-clear" class="settings-action">清除進度</button>
        </div>
        <p id="settings-note">清除後將無法使用「繼續遊戲」。</p>
      </div>
    </div>

    <!-- 神界部門名冊 (deity roster) -->
    <div id="roster-layer" class="hidden">
      <div id="roster-panel">
        <div id="roster-header">
          <h2>神界部門名冊</h2>
          <button id="roster-close" aria-label="關閉"></button>
        </div>
        <div id="roster-grid"></div>
        <div id="roster-pager" class="hidden">
          <button id="roster-prev">◀ 上一頁</button>
          <span id="roster-page-label"></span>
          <button id="roster-next">下一頁 ▶</button>
        </div>
      </div>
    </div>

    <!-- 主管登錄視窗 (nickname entry) -->
    <div id="nickname-screen" class="hidden">
      <div id="nickname-panel">
        <div id="nickname-eyebrow">神明客服中心・人事登錄系統</div>
        <h2 id="nickname-title">請登錄新任主管姓名</h2>
        <input id="nickname-input" type="text" maxlength="12" placeholder="主管" autocomplete="off" />
        <div id="nickname-error">姓名不可空白，請輸入登錄姓名。</div>
        <button id="nickname-confirm">確認登錄</button>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div id="loading-emblem">神</div>
      <div id="loading-title">神明客服中心</div>
      <div id="loading-line"></div>
    </div>

    <!-- 序章・完 (chapter end card, shown over the whiteout transition) -->
    <div id="chapter-end" class="hidden">
      <div id="chapter-end-glow" aria-hidden="true"></div>
      <div id="chapter-end-motes" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div id="chapter-end-inner">
        <div id="chapter-end-seal"><span>終</span></div>
        <div id="chapter-end-title">序章・完</div>
        <div class="ending-rule" aria-hidden="true"><span></span><i></i><span></span></div>
        <div id="chapter-end-sub">神明客服中心</div>
        <div id="chapter-end-hint">點擊繼續</div>
      </div>
    </div>

    <!-- CTA — 導流到正式遊戲 -->
    <div id="cta-screen" class="hidden">
      <div id="cta-backdrop" aria-hidden="true"></div>
      <div id="cta-inner">
        <div id="cta-emblem"><span>神</span></div>
        <h2 id="cta-title">神明客服中心</h2>
        <p id="cta-en">DIVINE CUSTOMER SERVICE CENTER</p>
        <div class="ending-rule" aria-hidden="true"><span></span><i></i><span></span></div>
        <p id="cta-copy">想繼續體驗真正的神明客服生活嗎？</p>
        <a id="cta-button" href="https://loveydovey.onelink.me/vs4G/ubytpuuo" target="_blank" rel="noopener noreferrer">前往卿卿我我開始遊戲</a>
        <p id="cta-tagline">每一個願望，都值得被聽見。</p>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
