name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/divine-customer-service-game-nqsmj9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # main is both the default branch and an allowed deployment branch on
    # the github-pages environment. That environment allowlist is separate
    # from the repository default and does not follow it, so this is
    # pinned to a branch name rather than derived from the event — the
    # allowlist has to be updated alongside any change here.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `enablement: true` turns Pages on for the repo the first time this
      # runs, so no manual toggle in Settings is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is already a plain static site: index.html at the root
      # plus css/, js/ and assets/. Nothing to build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
