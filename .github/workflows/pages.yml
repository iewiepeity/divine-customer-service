name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/divine-customer-service-game-nqsmj9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The github-pages environment carries its own list of branches that
    # are allowed to deploy, fixed when Pages was first enabled — it is
    # NOT the repository's current default branch. A push from any other
    # branch is rejected before the job starts, so we gate on the branch
    # the environment actually accepts and let the rest skip cleanly.
    #
    # To deploy from main instead, add main under
    # Settings → Environments → github-pages → Deployment branches,
    # then change this to 'main'.
    if: github.ref_name == 'claude/divine-customer-service-game-nqsmj9'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `enablement: true` turns Pages on for the repo the first time this
      # runs, so no manual toggle in Settings is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is already a plain static site: index.html at the root
      # plus css/, js/ and assets/. Nothing to build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
