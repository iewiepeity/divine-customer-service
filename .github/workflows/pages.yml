name: Deploy to GitHub Pages

on:
  push:
    # The `github-pages` environment only accepts deployments from the
    # repository's default branch, which is currently the claude/* branch
    # rather than main. Both are kept at the same commit, so triggering on
    # either one deploys the same site — and this keeps working if the
    # default branch is switched to main later.
    branches:
      - main
      - claude/divine-customer-service-game-nqsmj9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch is allowed to deploy to the github-pages
    # environment, so a push to any other branch skips cleanly instead of
    # failing. Reading the default branch from the event means this keeps
    # working if it is switched to main later.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `enablement: true` turns Pages on for the repo the first time this
      # runs, so no manual toggle in Settings is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is already a plain static site: index.html at the root
      # plus css/, js/ and assets/. Nothing to build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
